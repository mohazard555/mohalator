
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finexa | نظام إدارة محاسبية ذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: 'var(--primary-color)',
                dark: 'var(--primary-color)',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبات التصدير الاحترافية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
      :root { --primary-color: #1e40af; }
      body { 
        font-family: 'Cairo', sans-serif; 
        margin: 0; 
        -webkit-font-smoothing: antialiased;
      }
      
      /* --- ضوابط الطباعة وتعدد الصفحات --- */
      @media print {
        @page {
          size: A4;
          margin: 15mm;
        }
        
        /* إجبار الخلفية البيضاء في كل مكان عند الطباعة */
        html, body { 
          background: white !important; 
          color: black !important;
          width: 100% !important;
          height: auto !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
          font-size: 11pt !important;
        }

        #root {
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .export-fix, .professional-invoice-box, [ref="reportRef"], .export-container-fix {
          background-color: white !important;
          color: black !important;
          box-shadow: none !important;
          border: none !important;
        }

        /* إخفاء عناصر الوضع المظلم القهرية */
        .dark {
           background-color: white !important;
           color: black !important;
        }

        .dark * {
          background-color: transparent !important;
          color: black !important;
          border-color: #d1d5db !important; /* zinc-300 */
        }

        /* Keep colors for specific elements if needed, or force light gray */
        .dark .bg-primary, .bg-primary, 
        .dark .bg-rose-900, .bg-rose-900,
        .dark .bg-blue-800, .bg-blue-800,
        .bg-zinc-900, .dark .bg-zinc-900,
        .bg-zinc-800, .dark .bg-zinc-800,
        .bg-zinc-950, .dark .bg-zinc-950 {
           background-color: transparent !important;
           color: black !important;
        }

        /* Table specific print styles */
        table {
          width: 100% !important;
          border-collapse: collapse !important;
        }
        
        th {
          background-color: #f8fafc !important; /* slate-50 */
          color: #000 !important;
          border-bottom: 2px solid #e2e8f0 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        
        td {
          border-bottom: 1px solid #e2e8f0 !important;
        }

        .pdf-page-break {
          page-break-after: always !important;
          break-after: page !important;
          display: block !important;
        }
        
        tr { page-break-inside: avoid !important; break-inside: avoid !important; }
        thead { display: table-header-group !important; }
        
        .no-print, nav, header:not(.print-header), button, .sidebar, .modal-backdrop { 
          display: none !important; 
        }

        /* Force print colors */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        
        /* Remove shadows and rounded corners for cleaner print */
        * {
          box-shadow: none !important;
          border-radius: 0 !important;
        }
      }

      .export-container-fix {
        direction: rtl !important;
        text-align: right !important;
        background: white !important;
        color: black !important;
      }

      .text-readable {
        color: inherit;
      }
      .dark .text-readable {
        color: #f4f4f5;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@google/genai": "https://esm.sh/@google/genai@^0.2.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
